name: ai-apps-prod-compose # fixed Compose project name
services: # containers in this project
  app: # production application container
    image: ai-apps-prod-image # built and scanned in step 8
    container_name: ai-apps-prod-container # fixed Docker container name
    pull_policy: never # never replace the scanned image
    user: appuser # non-root user from Dockerfile
    working_dir: /app # terminal opens in the project
    cap_drop: [ALL] # remove every Linux capability
    security_opt: ["no-new-privileges:true"] # block privilege escalation
    networks: [frontend-net, model-net] # frontend-net reaches proxy; model-net reaches llama; both internal
    volumes: # storage for this service
      - "${USERPROFILE:-${HOME}}/ai-apps-projects:/app/my-projects" # user files
    environment:
      LLAMA_BASE_URL: http://llama:8080/v1
  llama: # local llama.cpp server, CPU
    image: ghcr.io/ggml-org/llama.cpp:server # GPU: use :server-cuda instead
    container_name: llama-cpp-container-prod # fixed Docker container name
    pull_policy: never # run only the scanned image
    user: "1000:1000" # same uid as appuser, matches cache owner
    read_only: true # filesystem writes blocked
    tmpfs: ["/tmp"] # scratch space read_only requires
    cap_drop: [ALL] # remove every Linux capability
    security_opt: ["no-new-privileges:true"] # block privilege escalation
    networks: [model-net] # no internet, no host port
    volumes: # storage for this service
      - hf-cache:/home/appuser/.cache/huggingface:ro # same path as download, read only
    command: ["--model", 
              # "/home/appuser/.cache/huggingface/hub/models--unsloth--gemma-4-E2B-it-GGUF/snapshots/0314792d7f1f7e229411f620751375812bb9faf2/gemma-4-E2B-it-Q4_K_M.gguf", 
              "/home/appuser/.cache/huggingface/hub/models--unsloth--Qwen3.5-0.8B-GGUF/snapshots/6ab461498e2023f6e3c1baea90a8f0fe38ab64d0/Qwen3.5-0.8B-Q4_K_M.gguf",
              "--mmproj", 
              # "/home/appuser/.cache/huggingface/hub/models--unsloth--gemma-4-E2B-it-GGUF/snapshots/0314792d7f1f7e229411f620751375812bb9faf2/mmproj-F16.gguf", 
              "/home/appuser/.cache/huggingface/hub/models--unsloth--Qwen3.5-0.8B-GGUF/snapshots/6ab461498e2023f6e3c1baea90a8f0fe38ab64d0/mmproj-F16.gguf",
              "--reasoning", "off",
              "--host", 
              "0.0.0.0", 
              "--port", 
              "8080"]
  proxy: # localhost-only reverse proxy
    image: nginxinc/nginx-unprivileged:stable-alpine-slim # unprivileged Nginx image
    container_name: ai-apps-proxy-container # fixed container name
    pull_policy: never # use local scanned image
    depends_on: [app] # start app before proxy
    read_only: true # prevent filesystem writes
    tmpfs: ["/tmp"] # temporary writable storage
    cap_drop: [ALL] # remove Linux capabilities
    security_opt: ["no-new-privileges:true"] # prevent privilege escalation
    networks: [frontend-net, proxy-net] # connect app and host-facing networks
    ports: ["127.0.0.1:8501:8080"] # expose proxy on localhost only
    volumes: # mount Nginx configuration
      - type: bind # mount host file
        source: ./nginx-default.conf # host configuration file
        target: /etc/nginx/conf.d/default.conf # container configuration path
        read_only: true # prevent configuration changes
        bind:
          create_host_path: false # fail if file missing
networks: # define container networks
  frontend-net:
    internal: true # isolate app and proxy
  model-net:
    internal: true # isolate app and llama
  proxy-net:
    driver: bridge # allows localhost port publishing and outbound internet access
volumes: # persistent Docker volumes
  hf-cache:
    external: true # require existing model volume