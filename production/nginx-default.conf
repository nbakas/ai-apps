map $http_upgrade $connection_upgrade { # handle WebSocket connections
    default upgrade; # upgrade when requested
    '' close; # close when no upgrade
}
server {
    listen 8080; # listen on container port
    server_name localhost 127.0.0.1; # names for this server; others also accepted
    client_max_body_size 200m; # maximum upload size
    location / { # handle all requests
        proxy_pass http://app:8501; # forward to Streamlit service
        proxy_http_version 1.1; # WebSockets require HTTP/1.1
        proxy_set_header Host $host; # preserve original hostname
        proxy_set_header Upgrade $http_upgrade; # forward WebSocket upgrade
        proxy_set_header Connection $connection_upgrade; # manage connection upgrade
        proxy_read_timeout 86400; # allow 24 hours between upstream reads
    }
}